<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Battery Intel · 분석실</title>
<style>
:root{--ink:#17261c;--muted:#68736a;--line:#dbe4d7;--bg:#f4f7f1;--deep:#17261c;--green:#147a5b;--lime:#b6df8e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif}header,main{max-width:1240px;margin:auto;padding:0 24px}header{padding-top:20px;padding-bottom:20px;display:flex;gap:15px;align-items:center}.logo{font-size:19px;font-weight:800}.logo span{color:var(--green)}.tag,.eyebrow,.meta{font:700 10px/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}.tag{color:var(--muted)}.spacer{flex:1}.back{background:#fff;border:1px solid var(--line);border-radius:999px;color:var(--ink);padding:9px 13px;font-size:12px;text-decoration:none}.hero{background:var(--deep);color:#fff;border-radius:24px;padding:36px;margin-bottom:18px}.eyebrow{color:var(--lime)}h1{font-size:clamp(32px,4vw,52px);letter-spacing:-.06em;line-height:1.04;margin:12px 0}.hero p{max-width:640px;color:#d7e2d5;line-height:1.55;margin:0}.hub{display:grid;grid-template-columns:1fr 300px;gap:16px}.mapPanel,.detail{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.mapPanel h2,.detail h2{font-size:18px;margin:0 0 5px}.sub{font-size:12px;line-height:1.5;color:var(--muted);margin:0}.world{position:relative;margin-top:18px;min-height:500px;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#eef5ed,#f9fbf7)}.world svg{width:100%;height:100%;position:absolute;inset:0}.land{fill:#d5e3d4}.gridline{stroke:#c6d8c5;stroke-width:.7}.agent{position:absolute;transform:translate(-50%,-50%);border:0;background:transparent;cursor:pointer;text-align:center;padding:0}.face{width:54px;height:54px;border-radius:18px;background:var(--tone);border:3px solid #fff;box-shadow:0 6px 16px #17261c22;display:grid;place-items:center;font-size:28px;transition:.15s}.agent span{display:block;white-space:nowrap;margin-top:6px;font:700 10px/1 ui-monospace,monospace;color:var(--ink);text-shadow:0 1px #fff}.agent:hover .face,.agent.on .face{transform:scale(1.1);box-shadow:0 0 0 4px var(--ring),0 8px 17px #17261c25}.na{left:21%;top:38%}.eu{left:51%;top:30%}.kr{left:73%;top:39%}.jp{left:79%;top:43%}.cn{left:67%;top:47%}.other{left:48%;top:70%}.detail{display:flex;flex-direction:column}.meta{color:var(--green);margin-top:14px}.agentName{font-size:24px;margin:7px 0}.emoji{font-size:50px;line-height:1}.detail p{font-size:13px;line-height:1.65;color:var(--muted)}.topics{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}.topics span{padding:7px 9px;background:#f0f5ee;border-radius:999px;font:600 11px/1 ui-monospace,monospace;color:#425346}.note{margin:16px 0 28px;color:var(--muted);font-size:12px}.note b{color:var(--green)}@media(max-width:760px){header,main{padding-left:16px;padding-right:16px}.hub{grid-template-columns:1fr}.hero{padding:27px 22px;border-radius:18px}.world{min-height:430px}.detail{min-height:210px}.face{width:46px;height:46px;font-size:24px}.agent span{font-size:8px}}
</style></head><body><header><div class="logo">Battery<span>·</span>Intel</div><div class="tag">권역 분석실</div><div class="spacer"></div><a class="back" href="index.html">← 뉴스 대시보드</a></header><main>
<section class="hero"><div class="eyebrow">Regional intelligence hub</div><h1>세계의 신호를<br>권역 에이전트가 읽습니다.</h1><p>미국·유럽·중국·한국·일본·기타 권역 담당 에이전트가 각 시장의 투자, 기술, 수요, 정책 변화를 소재사 관점에서 정리합니다.</p></section>
<section class="hub"><article class="mapPanel"><h2>글로벌 에이전트 맵</h2><p class="sub">에이전트를 선택해 담당 범위와 주요 관찰 신호를 확인하세요.</p><div class="world"><svg viewBox="0 0 1000 560" preserveAspectRatio="none" aria-hidden="true"><path class="land" d="M40 115l130-58 86 24 37 80-68 82-98-6-63-59zM270 245l83 24 28 111-42 133-45-22-22-116zM450 95l116-35 101 44 59 8 70 55-47 40-71-9-55 54-89-23-55-55zM584 255l78 9 50 88-12 139-60 35-50-86zM740 245l81 9 82 75-30 133-92-7-44-80zM815 90l73-30 71 55-29 55-68-7z"/><path class="gridline" fill="none" d="M0 105h1000M0 210h1000M0 315h1000M0 420h1000M125 0v560M250 0v560M375 0v560M500 0v560M625 0v560M750 0v560M875 0v560"/></svg>
<button class="agent na on" data-agent="미국" style="--tone:#e9eafa;--ring:#7886d9"><i class="face">🦝</i><span>미국</span></button><button class="agent eu" data-agent="유럽" style="--tone:#fff0db;--ring:#e1a44b"><i class="face">🦉</i><span>유럽</span></button><button class="agent cn" data-agent="중국" style="--tone:#fdebed;--ring:#dc707b"><i class="face">🐼</i><span>중국</span></button><button class="agent kr" data-agent="한국" style="--tone:#e7f3e9;--ring:#53a37d"><i class="face">🦊</i><span>한국</span></button><button class="agent jp" data-agent="일본" style="--tone:#f1eafa;--ring:#9270bd"><i class="face">🐱</i><span>일본</span></button><button class="agent other" data-agent="기타" style="--tone:#e6f4f0;--ring:#4ca492"><i class="face">🐢</i><span>기타</span></button></div></article><aside class="detail" id="detail"></aside></section><p class="note"><b>현재 상태:</b> 권역 선택 UI가 준비되었습니다. 이후 각 에이전트는 최신 뉴스와 저장된 시계열 이벤트를 바탕으로 AI 분석 메모를 생성합니다.</p>
</main><script>
const agents={미국:['🦝','디트로이트 너구리','IRA·현지 생산·완성차 수요와 북미 JV의 실질적인 투자·조달 변화를 추적합니다.',['IRA·관세','북미 JV','완성차 수요']],유럽:['🦉','브뤼셀 부엉이','배터리 여권, 재활용 규제, 유럽 완성차의 전동화 계획과 현지 공급망을 읽습니다.',['배터리 여권','재활용 규제','유럽 OEM']],중국:['🐼','상하이 판다','CATL·BYD 중심의 증설, LFP 가격, 중국 내 수요와 공급과잉 신호를 모니터링합니다.',['LFP·나트륨','CATL·BYD','가격 경쟁']],한국:['🦊','포항 여우','국내 소재사·셀사의 투자, 고니켈·전고체 기술, 정책 및 공급망 변화를 분석합니다.',['국내 3사','양극재','전고체']],일본:['🐱','도쿄 고양이','일본 완성차의 배터리 전략과 소재 내재화, 전고체 상용화 로드맵을 살핍니다.',['도요타','전고체','소재 내재화']],기타:['🐢','글로벌 거북이','호주·남미 광물, 동남아 생산기지, 인도 및 중동 ESS 등 기타 권역의 공급망 신호를 연결합니다.',['리튬 광산','동남아','글로벌 ESS']]};function selectAgent(key){const a=agents[key];document.querySelectorAll('.agent').forEach(x=>x.classList.toggle('on',x.dataset.agent===key));document.getElementById('detail').innerHTML=`<div class="emoji">${a[0]}</div><div class="meta">Regional Agent · ${key}</div><h2 class="agentName">${a[1]}</h2><p>${a[2]}</p><div class="topics">${a[3].map(x=>`<span>${x}</span>`).join('')}</div>`}document.querySelectorAll('.agent').forEach(b=>b.onclick=()=>selectAgent(b.dataset.agent));selectAgent('미국');
</script><script src="assets/office-agent.js"></script></body></html>
